name: Build Psych Engine HTML5 and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4
        with:
          path: playground

      - name: Checkout the exact Psych Engine 0.7.3 source
        uses: actions/checkout@v4
        with:
          repository: ShadowMario/FNF-PsychEngine
          ref: 2dfa27773a3668e0c1b043a3fb4348942c8a6fb3
          path: psych-engine

      - name: Set up Haxe 4.3.2
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.2

      - name: Install Psych Engine 0.7.3 web dependencies
        run: |
          haxelib setup "$HOME/haxelib"
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.3.2 --quiet
          haxelib install flixel 5.5.0 --quiet
          haxelib install flixel-addons 3.2.1 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev

      - name: Prepare Psych Engine for a browser build
        run: python3 playground/scripts/prepare-psych-html5.py psych-engine

      - name: Compile the actual Psych Engine runtime to HTML5
        working-directory: psych-engine
        run: haxelib run lime build Project.xml html5 -release

      - name: Publish the engine itself at the Pages root
        run: |
          test -f psych-engine/export/release/html5/bin/index.html
          rm -rf playground/site
          mkdir -p playground/site
          cp -R psych-engine/export/release/html5/bin/. playground/site/
          # Give every build a unique JS URL so the browser cannot reuse an
          # older cached PsychEngine.js after GitHub Pages deploys new code.
          python3 - <<'PY'
          from pathlib import Path
          import os

          site = Path("playground/site")
          build_id = os.environ["GITHUB_SHA"][:12]
          old_js = site / "PsychEngine.js"
          versioned_js = site / f"PsychEngine-{build_id}.js"
          if not old_js.exists():
              raise SystemExit("Compiled PsychEngine.js was not found")
          old_js.rename(versioned_js)

          index = site / "index.html"
          html = index.read_text(encoding="utf-8")
          old_src = 'src="./PsychEngine.js"'
          new_src = f'src="./{versioned_js.name}"'
          if old_src not in html:
              raise SystemExit("Could not find PsychEngine.js script tag in index.html")
          html = html.replace(old_src, new_src, 1)
          html = html.replace(
              "<title>Friday Night Funkin': Psych Engine</title>",
              f"<title>Psych Playground ({build_id})</title>",
              1
          )
          index.write_text(html, encoding="utf-8")
          print(f"Published cache-busted engine bundle: {versioned_js.name}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/site

      - name: Wait for Pages artifact metadata
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
